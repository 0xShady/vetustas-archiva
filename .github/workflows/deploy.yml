name: Deploy data

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate

  sync:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Pull data + re-seed game DB + refresh archive API
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail

            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd "$DEPLOY_PATH"
            git pull origin main

            cd ../game
            set -a
            [ -f .env ] && . ./.env
            set +a

            DATASETS_DIR="$DEPLOY_PATH/datasets" npm run seed:datasets -- --dry-run

            DATASETS_DIR="$DEPLOY_PATH/datasets" npm run seed:datasets

            pm2 restart vetustas-archive-api
